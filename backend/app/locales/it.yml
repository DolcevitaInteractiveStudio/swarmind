# Interpretazioni di metrics.py: "Etichetta (valori): significato". La parte prima di "): " si toglie nella tabella del report.
metrics:
  polarization_delta:
    insufficient_data: "Dati insufficienti per calcolare la polarizzazione della convinzione nel tempo (servono almeno 2 round)."
    # Polarizzazione della convinzione (opinion_strength): parla solo dell'intensità delle convinzioni
    polarization_active: "Convinzione più polarizzata (delta +{delta}): durante la conversazione l'intensità delle convinzioni si è divaricata, tra agenti molto convinti e agenti poco convinti."
    depolarization: "Convinzione meno polarizzata (delta {delta}): durante la conversazione l'intensità delle convinzioni si è avvicinata: gli agenti sono diventati più simili per quanto sono convinti."
    stable: "Convinzione stabile (delta {delta}): durante la conversazione la distribuzione dell'intensità delle convinzioni non è cambiata in modo significativo."
  echo_chamber_index:
    insufficient_data: "Dati insufficienti per calcolare l'echo chamber index (servono almeno 3 round con 2+ post)."
    failed: "Non è stato possibile calcolare la similarità dei post."
    echo_chamber_strong: "Echo chamber forte (similarità media {score}): gli agenti convergono su un vocabolario comune, amplificando le stesse idee anziché contrastarle. Il tema produce eco, non dibattito."
    partial_debate: "Dibattito parziale (similarità media {score}): coesistono posizioni diverse ma con contaminazione reciproca dei vocabolari. C'è ascolto tra le fazioni."
    parallel_silos: "Silos paralleli (similarità media {score}): gli agenti parlano di argomenti troppo diversi tra loro. Il tema non è riuscito a unificare il dibattito in un terreno comune."
  information_diversity:
    insufficient_data: "Dati insufficienti per calcolare la diversità informativa (servono almeno 3 round)."
    insufficient_trend: "Dati insufficienti per il trend di diversità."
    rapid_collapse: "Appiattimento narrativo rapido ({delta_pct}% di keyword uniche tra prima e seconda metà della simulazione): la conversazione converge rapidamente su pochi temi dominanti, escludendo sfumature. Segnale di saturazione narrativa."
    gradual_convergence: "Convergenza graduale ({delta_pct}% di keyword uniche): il dibattito mette a fuoco gradualmente 2-3 temi centrali, escludendo il rumore. Dinamica sana di consolidamento."
    diversity_growth: "Espansione narrativa ({delta_pct}% di keyword uniche in più): la conversazione si apre nel tempo a nuovi argomenti. Indica che il tema genera approfondimenti inattesi."
    stable_diversity: "Diversità stabile ({delta_pct}% di variazione): la conversazione mantiene una varietà costante di argomenti senza appiattirsi né espandersi significativamente."

