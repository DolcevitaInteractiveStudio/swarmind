    bassa: "Bassa"
    media: "Media"
    alta: "Alta"
  indicative_suffix: " (indicativa)"
  rule: >-
    con meno di {small_agents} agenti, {small_rounds} round o {small_posts} post è al massimo
    "bassa (indicativa)"; con meno di {medium_agents} agenti, {medium_rounds} round o
    {medium_posts} post al massimo "media"
  sample_counts: "{agents} agenti, {rounds} round, {posts} post"
  nouns:
    agents: "agenti"
    rounds: "round"
    posts: "post"
  fewer_than: "meno di {count} {noun}"
  sample_small: "campione ridotto ({why}): al massimo \"{cap}\""
  sample_medium: "campione medio ({why}): al massimo \"{cap}\""
  # Stabilità dalla posizione (consenso e spostamento); senza misura della posizione, dalla convinzione
  stability_stance: "posizione ({group}): consenso {consensus}, {shift}: stabilità \"{stability}\""
  stability: "posizione non misurata, stabilità dalla convinzione (varianza {variance}, entropia della convinzione, ultimo round, {entropy}): \"{stability}\""
  line: "**Livello di confidenza: {label}** — calcolato dal sistema: {basis}."

