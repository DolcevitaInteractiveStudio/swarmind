# Messaggi di fallimento e stop di simulazioni e grafi (simulation/lifecycle.py). Salvati come codice
# con parametri (simulations.error_detail, projects.graph_error_detail) e resi alla lettura, nella
# lingua della richiesta.
lifecycle:
  phase_failed:
    graph: "Costruzione del grafo non riuscita: {reason}"
    spawn: "Generazione degli agenti non riuscita: {reason}"
    rounds: "Simulazione interrotta durante i round: {reason}"
    report: "Generazione del report non riuscita: {reason}"
    other: "Elaborazione non riuscita: {reason}"
  rebuild_failed: "Ricostruzione del grafo non riuscita: {reason} (resta in uso il grafo precedente)"
  stale_simulation: >-
    La simulazione si è interrotta senza esito: il worker è stato riavviato o il task è andato perso.
    Puoi crearne una nuova.
  redelivered: >-
    Simulazione interrotta dal riavvio del worker durante i round: non viene ripresa, perché
    ripartirebbe da capo. Puoi crearne una nuova.
  stopped_by_user: "Simulazione fermata dall'utente."
  stale_graph: >-
    Costruzione del grafo interrotta senza esito: il worker è stato riavviato o il task è andato perso.
    Usa «Ricostruisci grafo» per riprovare dal file caricato.
  llm_error: "{hint} (HTTP {status})"
  llm_error_detail: "{hint} (HTTP {status}): {detail}"
  llm_hint:
    "400": "il provider LLM ha rifiutato la richiesta"
    "401": "chiave API non valida"
    "402": "credito del provider LLM esaurito"
    "403": "la chiave API non ha accesso a questo modello"
    "404": "modello LLM non trovato"
    "408": "il provider LLM non ha risposto in tempo"
    "409": "conflitto temporaneo sul provider LLM"
    "422": "il provider LLM ha rifiutato i parametri della richiesta"
    "429": "limite di richieste del provider LLM superato"
    server_error: "errore del provider LLM"
    rejected: "richiesta rifiutata dal provider LLM"
  reason:
    worker_lost: "il processo worker è stato terminato (memoria esaurita o riavvio)"
    no_agents: "nessun agente generato: le risposte del modello non sono utilizzabili"
    no_valid_replies: "nessun agente ha prodotto una risposta valida ({failed} chiamate fallite). Verifica il modello e la credenziale."
    no_brief: "il progetto non ha un brief, che il Demographer richiede come input"
    empty_document: "il documento sorgente non contiene testo"

# Contenuto predefinito della landing page (core/site_settings.py), finché un admin non salva il suo.
# Posizionamento: uno stress test della narrativa prima del lancio, mai una previsione di mercato.
landing:
  default:
    hero:
      title: "Metti alla prova la tua narrativa prima che lo faccia il mercato"
      subtitle: >-
        SwarMind simula come reagisce una popolazione di agenti AI con profili diversi a un
        rebranding, a un nuovo prezzo, a un lancio o a un comunicato di crisi. Vedi le obiezioni,
        gli argomenti che si diffondono e le voci contrarie, così il tuo cliente arriva preparato
        al lancio. Non prevede il mercato: mostra che cosa un messaggio rischia di incontrare.
      primary_cta:
        label: "Richiedi una demo"
        target: "#contact"
      secondary_cta:
        label: "Come funziona"
        target: "#how"
    sections:
      value:
        title: "A cosa serve"
        intro: "Una prova generale per i messaggi che non possono sbagliare il primo giorno."
        items:
          - title: "Trova le obiezioni in anticipo"
            text: "Scopri dubbi, confronti e fraintendimenti che un messaggio provoca prima che arrivi ai clienti veri."
          - title: "Confronta le versioni"
            text: "Metti la stessa popolazione davanti a due nomi, due prezzi o due comunicati e confronta i dibattiti."
          - title: "Arriva preparato"
            text: "Porta al cliente le risposte alle obiezioni che incontrerà, insieme al dibattito da cui sono emerse."
          - title: "Chiaro sui suoi limiti"
            text: "Gli agenti sono simulazioni, non intervistati. I risultati sono ipotesi da verificare con persone reali, non una previsione."
      how:
        title: "Come funziona"
        intro: "Dal brief al report in quattro passaggi."
        items:
          - title: "Carica il brief"
            text: "I documenti su marchio, prodotto e mercato diventano le conoscenze a cui attingono gli agenti."
          - title: "Genera la popolazione"
            text: "SwarMind crea personaggi con storie, priorità e posizioni diverse, compresa una quota limitata di voci deliberatamente critiche."
          - title: "Avvia il dibattito"
            text: "Per diversi round gli agenti pubblicano, rispondono e cambiano idea. Il feed mette in evidenza ciò che prende piede."
          - title: "Leggi il report"
            text: "Il report riassume le obiezioni, gli argomenti che hanno retto e come si è mosso il dibattito, con misure di polarizzazione e camere d'eco."
      use_cases:
        title: "Casi d'uso"
        intro: "Modelli per i momenti in cui una narrativa è più esposta."
        items:
          - title: "Rebranding"
            text: "I clienti storici seguiranno un nuovo nome o una nuova identità? Dove si rompe il ponte tra generazioni?"
          - title: "Prezzi"
            text: "Come reagiscono gli acquirenti a un nuovo prezzo o piano, e quali obiezioni arrivano da acquisti e finanza?"
          - title: "Lancio di prodotto"
            text: "Quali promesse vengono credute, quali messe in dubbio, e con che cosa viene confrontato il prodotto?"
          - title: "Comunicazione di crisi"
            text: "Quale versione di un comunicato contiene il danno, e quale lo alimenta?"
          - title: "Validazione di funzionalità"
            text: "Una nuova funzionalità giustifica un prezzo, o viene percepita come rumore?"
      deliverables:
        title: "Che cosa ottieni"
        intro: "Materiale da portare in una riunione con il cliente."
        items:
          - title: "Un report strutturato"
            text: "Obiezioni principali, argomenti a favore, i gruppi più esposti e raccomandazioni, in italiano o in inglese."
          - title: "L'intero dibattito"
            text: "Ogni post e risposta, per round e per agente, così ogni risultato si può ricondurre alla sua origine."
          - title: "Misure del dibattito"
            text: "Polarizzazione, indice di camera d'eco e varietà delle informazioni, calcolati dalla simulazione stessa."
          - title: "Conversazioni con gli agenti"
            text: "Chiedi a un agente perché ha cambiato idea, o che cosa lo convincerebbe."
          - title: "Esportazione PDF"
            text: "Un report da condividere con il team del cliente."
      open_source:
        title: "Open source"
        intro: "SwarMind è anche un progetto open source: puoi installarlo sul tuo server, con le tue chiavi dei modelli."
        github_url: "https://github.com/DolcevitaInteractiveStudio/swarmind"
        docs_url: ""
        license_name: "AGPL-3.0"
        install_snippet: |-
          git clone https://github.com/DolcevitaInteractiveStudio/swarmind.git swarmind
          cd swarmind
          cp .env.example .env   # poi imposta ENCRYPTION_KEY: vedi il README
          docker compose up -d
      contact:
        title: "Richiedi una demo"
        intro: "Raccontaci il lancio, il rebranding o il comunicato che devi mettere alla prova. Ti mostriamo una simulazione su un caso simile."
        cta_label: "Scrivici"
        # L'indirizzo viene da CONTACT_EMAIL (.env): core/site_settings.default_content
        email: ""
        url: ""
    footer:
      # Vuoto: il footer mostra il nome del prodotto
      company_name: ""
      contact_email: ""
      privacy_url: ""
      terms_url: ""
    seo:
      title: "SwarMind: metti alla prova la tua narrativa prima del lancio"
      description: >-
        Simula come reagisce una popolazione di agenti AI a un rebranding, a un prezzo o a un
        comunicato di crisi, e preparati alle obiezioni prima del lancio.
