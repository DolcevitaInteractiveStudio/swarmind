# SwarMind locale catalog: Italian.
# Text shown to the reader verbatim. Prompts stay in English in the code and end with
# core.i18n.language_directive(lang). Keys must match en.yml (verified by a script).
# Placeholders use str.format: {name}.

defaults:
  simulation_name: "Simulazione {id}"

feed:
  breaking_author: "Breaking News"
  breaking_prefix: "[BREAKING]"

subject_card:
  subject: "Soggetto"
  market: "Mercato"
  change: "Operazione"
  homonyms: "Da non confondere con"

agent:
  fallback_initial_opinion: "Sono scettico/a su: {topic}"
  fallback_critic_name: "Voce critica"
  fallback_critic_role: "Critico"
  no_opinion_yet: "Non ho ancora un'opinione precisa."
  fallback_belief_pragmatism: "Pragmatismo"
  fallback_belief_self_interest: "Interesse personale"
  fallback_motivation: "Stabilità"
  fallback_fear: "Incertezza"
  unknown_background: "Background sconosciuto."

# Se il Demographer non propone voci valide. Valgono per qualsiasi soggetto: niente lessico di settore.
critical_voices:
  fallback:
    - name: "Sostenitore storico deluso"
      role: "Persona che segue il soggetto da molti anni"
      background: >-
        Conosce il soggetto da molto tempo e ci è affezionato. Ha già visto annunciare
        cambiamenti che hanno portato poco a chi c'era da prima.
      core_beliefs:
        - "Un cambiamento deve portare qualcosa a chi c'è già, non solo a chi si vuole conquistare"
        - "Contano i fatti, non gli annunci"
      fears:
        - "Perdere ciò che rendeva riconoscibile il soggetto"
      motivations:
        - "Difendere ciò che apprezza da anni"
    - name: "Osservatore indipendente scettico"
      role: "Commentatore indipendente del settore"
      background: >-
        Segue il settore senza legami con il soggetto. Confronta le promesse con i risultati
        e con ciò che è successo ad altri in situazioni simili.
      core_beliefs:
        - "Questa operazione va giudicata sui risultati, non sulle intenzioni dichiarate"
        - "Molti cambiamenti simili hanno promesso più di quanto hanno ottenuto"
      fears:
        - "Che una bella storia nasconda l'assenza di sostanza"
      motivations:
        - "Dare al pubblico un giudizio indipendente"
    - name: "Sostenitore di un'alternativa"
      role: "Persona che ha scelto un'alternativa al soggetto"
      background: >-
        Ha valutato il soggetto e ha preferito un'alternativa. Non vede ancora un motivo
        concreto per cambiare idea.
      core_beliefs:
        - "Non vedo cosa offra questa operazione che le alternative non offrano già"
        - "Cambiare immagine non basta a guadagnare fiducia"
      fears:
        - "Lasciarsi convincere da promesse che poi non vengono mantenute"
      motivations:
        - "Fare la scelta migliore senza farsi guidare dagli annunci"

report:
  headings:
    # Posizionamento: uno stress test del messaggio prima del lancio, non una previsione di mercato. I report salvati
    # con i titoli di prima ("Report di Previsione", "Previsione") restano riconosciuti (postprocess, report_agent).
    title: "Report di stress-test"
    executive_summary: "Sintesi Esecutiva"
    simulation_metrics: "Metriche della Simulazione"
    opinion_landscape: "Panorama delle Opinioni"
    emerging_narratives: "Narrative Emergenti"
    agent_perspectives: "Prospettive degli Agenti"
    scenario_analysis: "Analisi degli Scenari"
    prediction: "Reazione più plausibile"
    confidence_assessment: "Valutazione della Confidenza"
    appendix: "Appendice Metodologica"
    population_composition: "Composizione della popolazione"
  metrics_table:
    metric: "Metrica"
    value: "Valore"
  likelihood:
    most: "più plausibile"
    plausible: "plausibile"
    less: "meno plausibile"
    # Nota di chiusura degli scenari quando nessuno può essere il più plausibile (postprocess.enforce_scenario_likelihood)
    no_most_note: "Nessuno scenario è il più plausibile: le evidenze di questa simulazione non li distinguono."
  entropy:
    # Letture dell'entropia della convinzione: parlano solo dell'intensità delle convinzioni
    low: "convinzione concentrata"
    low_meaning: "quasi tutti gli agenti hanno un'intensità di convinzione simile"
    mid: "convinzione moderatamente dispersa"
    mid_meaning: "l'intensità delle convinzioni è distribuita su più livelli"
    high: "convinzione molto dispersa"
    high_meaning: "l'intensità delle convinzioni è distribuita su tutti i livelli"
  conviction_buckets:
    very_low: "convinzione_molto_bassa"
    low: "convinzione_bassa"
    medium: "convinzione_media"
    high: "convinzione_alta"
    very_high: "convinzione_molto_alta"
  tone_not_stated: "non indicato"
  # Etichette per il lettore delle metriche e dei campi che il modello del report riceve. I nomi
  # tecnici (mean_opinion_strength, opinion_entropy...) solo nell'appendice metodologica.
  labels:
    rounds: "Round"
    agents: "Agenti"
    total_posts: "Post totali"
    # "Consenso" è solo l'accordo sulla posizione verso il cambiamento; la varianza della convinzione è
    # l'omogeneità della convinzione
    consensus_level: "Consenso sulla posizione"
    conviction_uniformity: "Omogeneità della convinzione"
    mean_conviction: "Convinzione media"
    conviction: "convinzione"
    variance: "Varianza della convinzione"
    stance: "Posizione sul cambiamento"
    stance_natural: "Posizione sul cambiamento (agenti naturali)"
    stance_adversarial: "Posizione sul cambiamento (voci critiche)"
    stance_shift: "Spostamento di posizione (prima → ultima misura)"
    opinion_entropy: "Entropia della convinzione (ultimo round)"
    emotional_state: "stato emotivo"
    posts: "post"
  # Parole che sostituiscono i nomi tecnici scritti dal modello fuori dall'appendice metodologica
  field_words:
    mean_opinion_strength: "convinzione media"
    opinion_strength: "convinzione"
    opinion_entropy: "entropia della convinzione"
    consensus_level: "consenso sulla posizione"
    conviction_uniformity: "omogeneità della convinzione"
    emotional_state: "stato emotivo"
    posts_made: "post"
    polarization_delta: "polarizzazione della convinzione"
    echo_chamber_index: "echo chamber"
    information_diversity: "diversità informativa"
    is_adversarial: "voce critica"
  # Consenso sulla posizione (accordo sulla stance)
  consensus_levels:
    high: "alto"
    medium: "medio"
    low: "basso"
  # Omogeneità della convinzione (dalla varianza): non è consenso
  conviction_uniformity_levels:
    high: "alta"
    medium: "media"
    low: "bassa"
  # Posizione degli agenti sul cambiamento (valori enum in inglese nei dati)
  stance_values:
    support: "a favore"
    neutral: "neutrale"
    oppose: "contrario"
  stance:
    share: "{label} {count} ({pct})"
    agents_not_measured: "agenti non misurati: {count}"
    unparsed: "risposte non interpretate, contate come neutrali: {count}"
    not_measured: "non misurata (simulazione precedente alla misura della posizione)"
    consensus: "{level} ({pct} {stance})"
    consensus_tie: "{level} (nessuna maggioranza: {stances} a pari merito, {pct} ciascuna)"
    shift: "{changed} su {remeasured} agenti rimisurati hanno cambiato posizione ({toward_support} più favorevoli, {toward_oppose} più contrari): {reading}{cap_note}"
    shift_cap_note: " (meno di {min} agenti rimisurati: al massimo moderato)"
    shift_with_count: "{reading} ({changed} su {remeasured} agenti rimisurati)"
    # Posizione di un segmento con meno di 3 agenti: conteggi, mai percentuali
    count_share: "{count} su {total} {label}"
    shift_none: "nessun agente misurato due volte: spostamento non misurabile"
    shift_unmeasurable: "spostamento non misurabile"
    shift_readings:
      stable: "posizioni stabili"
      moderate: "spostamento moderato"
      large: "spostamento ampio"
    groups:
      natural: "agenti naturali"
      adversarial: "voci critiche"
  # Conteggi di agenti negli scenari e nella previsione, sostituiti da un quantificatore
  # (postprocess.remove_population_shares)
  population:
    noun: "agenti"
    noun_natural: "agenti naturali"
    quantifiers:
      none: "nessuno degli {noun}"
      few: "pochi {noun}"
      minority: "una minoranza degli {noun}"
      plurality: "una maggioranza relativa degli {noun}"
      half: "metà degli {noun}"
      majority: "la maggioranza degli {noun}"
      almost_all: "quasi tutti gli {noun}"
      all: "tutti gli {noun}"
  # Affermazioni degli agenti citate negli scenari e nella previsione (postprocess.mark_unverified_claims)
  claims:
    # L'attribuzione apre la frase intera, mai a metà
    attributed: "Secondo {agent}, {sentence} (affermazione dell'agente, non verificata nel brief: non è un'evidenza){end}"
  # Righe dei parametri dell'appendice, scritte dal sistema dalla simulazione salvata (postprocess.appendix_parameters)
  parameters:
    heading: "**Parametri della simulazione:**"
    template: "Template"
    agents: "Numero agenti totale"
    rounds: "Numero di round"
    topic: "Topic analizzato"
    question: "Domanda da verificare"
    not_specified: "non specificata"
  # Quota dei post pubblicati dai top 3 influencer, calcolata dal sistema (appendice)
  top3:
    share: "I top 3 hanno pubblicato il {top_pct} dei post ({top_posts} su {total_posts}); il restante {rest_pct} viene dagli agenti non citati."
    unknown: "La quota di post dei top 3 non è disponibile per questa simulazione."
  # Riscrittura di "consenso" nel testo del modello (postprocess.fix_consensus_wording)
  consensus_rewording:
    conviction_noun: "omogeneità della convinzione"
    level_before: "{level} {noun}"
    stance_level_before: "{level} {noun}"
    articles:
      il: "l'"
      lo: "l'"
      un: "un'"
      del: "dell'"
      al: "all'"
      sul: "sull'"
      nel: "nell'"
      dal: "dall'"
    unmeasured_noun: "posizioni prevalenti"
    unmeasured_articles:
      il: "le "
      lo: "le "
      un: "le "
      del: "delle "
      al: "alle "
      sul: "sulle "
      nel: "nelle "
      dal: "dalle "
  # Stati emotivi delle persone (valori enum in inglese nei dati): etichetta per il lettore
  emotional_states:
    neutral: "neutrale"
    anxious: "ansioso"
    optimistic: "ottimista"
    angry: "arrabbiato"
    curious: "curioso"
    skeptical: "scettico"
    sceptical: "scettico"
    enthusiastic: "entusiasta"
    frustrated: "frustrato"
    betrayed: "tradito"
    probing: "indagatore"
    weary: "stanco"
    challenged: "messo in discussione"
    critical_neutral: "critico ma neutrale"
    cautious: "cauto"
    concerned: "preoccupato"
    worried: "preoccupato"
    hopeful: "speranzoso"
    excited: "entusiasta"
    confused: "confuso"
    indifferent: "indifferente"
    disappointed: "deluso"
    critical: "critico"
    supportive: "solidale"
    pessimistic: "pessimista"
    nostalgic: "nostalgico"
    defensive: "sulla difensiva"
    irritated: "irritato"
    annoyed: "infastidito"
    interested: "interessato"
    doubtful: "dubbioso"
    uncertain: "incerto"
    resigned: "rassegnato"
    determined: "determinato"
    calm: "calmo"
    positive: "positivo"
    negative: "negativo"
    ambivalent: "ambivalente"
    intrigued: "incuriosito"
    alarmed: "allarmato"
    distrustful: "diffidente"
    suspicious: "sospettoso"
    passionate: "appassionato"
    proud: "orgoglioso"
    nervous: "nervoso"
    fearful: "timoroso"
    satisfied: "soddisfatto"
    dissatisfied: "insoddisfatto"
    pragmatic: "pragmatico"
    analytical: "analitico"
  template_none: "nessuno"
  adversarial_note_heading: "**Voci critiche:**"
  archetypes:
    population_demographer: "La composizione della popolazione è proposta dal Demographer (un modello LLM) a partire dal brief"
    population_kb: "Gli agenti naturali derivano dalle entità estratte dalla knowledge base"
    with_template: >-
      - {population}, e gli archetipi delle voci critiche (giornalista, competitor, early adopter
      ecc.) sono definiti dal template: nessuno dei due è validato contro distribuzioni
      demografiche reali.
    without_template: >-
      - {population}, e le voci critiche sono ricavate dal brief o indicate dall'utente (nessun
      template usato): nessuna delle due fonti è validata contro distribuzioni demografiche reali.
    # Una riga con questo testo descrive gli archetipi del template: sostituita se il template non c'è
    template_needle: "definiti dal template"
  # La riga dei limiti con questo testo si toglie se il report non ha una sezione di raccomandazioni
  recommendations_needle: "raccomandazioni operative"
  appendix: |-
    ---

    **Parametri della simulazione:**
    {parameters}

    **Criteri di selezione degli agenti citati:**
    I top 3 influencer sono selezionati per volume di post pubblicati. Gli altri agenti partecipano al calcolo delle metriche (posizione, convinzione, entropia) ma non sono citati individualmente nel report. {top3_sentence}

    **Voci critiche:**
    Le voci critiche sono agenti inseriti deliberatamente dal sistema per mettere alla prova le posizioni prevalenti. Non rappresentano una distribuzione di mercato naturale: la loro presenza amplifica le critiche per far emergere le vulnerabilità.

    **Confidence score — natura della metrica:**
    Il livello di confidenza è calcolato dal sistema, non dal modello: parte dalla stabilità delle posizioni degli agenti sul cambiamento (consenso e spostamento tra la prima e l'ultima misura; per le simulazioni senza misura della posizione, da variance e opinion_entropy della convinzione) ed è limitato dalla numerosità del campione ({confidence_rule}). Per questo gli scenari hanno solo una plausibilità qualitativa, senza percentuali. NON è calibrato retroattivamente contro esiti reali (nessun Brier score, nessun track record storico). Va letto come indicatore interno di stabilità delle posizioni simulate, non come probabilità di accuratezza predittiva verificata.

    **Limiti noti del metodo:**
    - La simulazione misura opinioni pre-lancio espresse da agenti LLM, non comportamenti reali di mercato.
    {archetypes_limitation}
    - Le posizioni rilevate possono essere in parte un artefatto del prompt iniziale di simulazione: prompt entusiasti o pessimisti possono orientare le dinamiche. Test A/B con prompt variati non sono inclusi in questa esecuzione.
    - Le raccomandazioni operative sono coerenti con lo stato del prodotto dichiarato nel topic ma non sono state validate con test reali di efficacia.
  # Frasi del codice nel paragrafo "Voci critiche" dell'appendice (postprocess.critical_voices_disclosure)
  share:
    not_recorded: "Quota di post delle voci critiche: non registrata per questa simulazione."
    none: "Quota di post delle voci critiche: 0% (nessuna voce critica in questa simulazione)."
    full: >-
      Quota di post delle voci critiche: {share} ({adversarial_posts} post su {posts} dell'intera
      simulazione), da {adversarial_agents} voci critiche su {total_agents} agenti. La quota dipende da
      quanto spesso il sistema fa intervenire queste voci: non misura quanto le critiche siano diffuse
      sul mercato.
    # I due tetti sono diversi: uno conta gli agenti, l'altro i post
    caps: >-
      Due limiti diversi regolano le voci critiche: al massimo il {agent_cap} degli agenti della
      simulazione può essere una voce critica (quota di agenti), e al massimo il {post_cap} dei post può
      venire dalle voci critiche (quota di post).
    truncated_one: >-
      Erano previste {planned} voci critiche; ne è stata tenuta {kept} per rispettare la quota massima di
      voci critiche ({agent_cap} degli agenti); {excluded}
    truncated_many: >-
      Erano previste {planned} voci critiche; ne sono state tenute {kept} per rispettare la quota massima
      di voci critiche ({agent_cap} degli agenti); {excluded}
    excluded_one: "quella esclusa è stata scelta a caso."
    excluded_many: "le {count} escluse sono state scelte a caso."
  relabel:
    natural_many: "voci critiche (agenti adversarial)"
    natural_one: "una voce critica (agente adversarial)"
    # Dentro una parentesi (niente parentesi annidate) e prima di un nome
    natural_many_flat: "voci critiche, agenti adversarial"
    paren: "voce critica, agente adversarial"
    before_name_article: "la voce critica"
    before_name: "voce critica"
    # Article of the plural label, replacing gli/i/the before "agenti naturali"
    many_article: "le"
  sections:
    objections_analysis: "Obiezioni Principali"
    buyer_rationalizations: "Razionalizzazioni degli Acquirenti"
    resistance_by_segment: "Resistenza per Segmento"
    pricing_levers: "Leve di Negoziazione"
    messaging_gaps: "Gap nel Messaggio di Lancio"
    positioning_risks: "Rischi di Posizionamento"
    early_adoption_signals: "Segnali di Adozione Early"
    competitive_response_prediction: "Risposta Competitiva Attesa"
    problem_severity: "Severità del Problema"
    workaround_analysis: "Analisi dei Workaround Esistenti"
    adoption_friction: "Frizione di Adozione"
    opportunity_cost: "Costo Opportunità"
    narrative_vulnerabilities: "Vulnerabilità della Narrativa"
    emotional_resonance: "Risonanza Emotiva"
    amplification_risks: "Rischi di Amplificazione"
    trust_recovery_path: "Percorso di Recupero della Fiducia"
    heritage_coherence: "Coerenza con l'Heritage del Brand"
    generational_bridge: "Ponte Generazionale: Vecchio Pubblico vs Nuovo Target"
    debate_dynamics: "Dinamiche del Dibattito"

