# SwarMind locale catalog: English (default language).
# Text shown to the reader verbatim. Prompts stay in English in the code and end with
# core.i18n.language_directive(lang). Keys must match it.yml (verified by a script).
# Placeholders use str.format: {name}.

defaults:
  simulation_name: "Simulation {id}"

feed:
  breaking_author: "Breaking News"
  breaking_prefix: "[BREAKING]"

subject_card:
  subject: "Subject"
  market: "Market"
  change: "Change tested"
  homonyms: "Not to be confused with"

agent:
  fallback_initial_opinion: "I am skeptical about: {topic}"
  fallback_critic_name: "Critical voice"
  fallback_critic_role: "Critic"
  no_opinion_yet: "I have no strong opinion yet."
  fallback_belief_pragmatism: "Pragmatism"
  fallback_belief_self_interest: "Self-interest"
  fallback_motivation: "Stability"
  fallback_fear: "Uncertainty"
  unknown_background: "Unknown background."

# Used when the Demographer proposes no valid critical voice. Valid for any subject: no sector vocabulary.
critical_voices:
  fallback:
    - name: "Disappointed long-time supporter"
      role: "Someone who has followed the subject for many years"
      background: >-
        Has known the subject for a long time and is attached to it. Has already seen
        announced changes bring little to those who were there before.
      core_beliefs:
        - "A change must give something to those already here, not only to those being courted"
        - "Results matter, announcements do not"
      fears:
        - "Losing what made the subject recognizable"
      motivations:
        - "Defending what they have valued for years"
    - name: "Skeptical independent observer"
      role: "Independent commentator on the sector"
      background: >-
        Follows the sector with no ties to the subject. Compares promises with results
        and with what happened to others in similar situations.
      core_beliefs:
        - "This move should be judged on results, not on stated intentions"
        - "Many similar changes promised more than they delivered"
      fears:
        - "A good story hiding a lack of substance"
      motivations:
        - "Giving the public an independent judgement"
    - name: "Supporter of an alternative"
      role: "Someone who chose an alternative to the subject"
      background: >-
        Considered the subject and preferred an alternative. Does not yet see a concrete
        reason to change their mind.
      core_beliefs:
        - "I do not see what this move offers that the alternatives do not already offer"
        - "A new image is not enough to earn trust"
      fears:
        - "Being won over by promises that are not kept"
      motivations:
        - "Making the best choice without being led by announcements"

