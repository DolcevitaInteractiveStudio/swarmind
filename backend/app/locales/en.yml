    graph: "Graph construction failed: {reason}"
    spawn: "Agent generation failed: {reason}"
    rounds: "Simulation interrupted during the rounds: {reason}"
    report: "Report generation failed: {reason}"
    other: "Processing failed: {reason}"
  rebuild_failed: "Graph rebuild failed: {reason} (the previous graph stays in use)"
  stale_simulation: >-
    The simulation stopped without a result: the worker was restarted or the task was lost.
    You can create a new one.
  redelivered: >-
    Simulation interrupted by a worker restart during the rounds: it is not resumed, because it
    would start over. You can create a new one.
  stopped_by_user: "Simulation stopped by the user."
  stale_graph: >-
    Graph construction stopped without a result: the worker was restarted or the task was lost.
    Use "Rebuild graph" to retry from the uploaded file.
  llm_error: "{hint} (HTTP {status})"
  llm_error_detail: "{hint} (HTTP {status}): {detail}"
  llm_hint:
    "400": "the LLM provider rejected the request"
    "401": "invalid API key"
    "402": "LLM provider credit exhausted"
    "403": "the API key has no access to this model"
    "404": "LLM model not found"
    "408": "the LLM provider did not respond in time"
    "409": "temporary conflict at the LLM provider"
    "422": "the LLM provider rejected the request parameters"
    "429": "LLM provider rate limit exceeded"
    server_error: "LLM provider error"
    rejected: "request rejected by the LLM provider"
  reason:
    worker_lost: "the worker process was terminated (out of memory or restart)"
    no_agents: "no agents generated: the model's responses could not be used"
    no_valid_replies: "no agent produced a valid reply ({failed} failed calls). Check the model and the credential."
    no_brief: "the project has no brief text, which the Demographer needs as input"
    empty_document: "the source document has no text"

# Default landing page content (core/site_settings.py), used until an admin saves their own.
# Positioning: a stress test of a narrative before launch, never a market forecast.
landing:
  default:
    hero:
      title: "Stress-test your narrative before the market does"
      subtitle: >-
        SwarMind simulates how a population of AI agents with different backgrounds reacts to a
        rebrand, a new price, a launch or a crisis statement. You see the objections, the
        arguments that spread and the voices that push back, so your client is prepared before
        launch. It does not predict the market: it shows what a message is likely to run into.
      primary_cta:
        label: "Request a demo"
        target: "#contact"
      secondary_cta:
        label: "How it works"
        target: "#how"
    sections:
      value:
        title: "What it is for"
        intro: "A rehearsal for messages that cannot afford to fail on day one."
        items:
          - title: "Find objections early"
            text: "See the doubts, comparisons and misreadings a message triggers before it reaches real customers."
          - title: "Compare versions"
            text: "Run the same population against two names, two prices or two statements and compare the debates."
          - title: "Arrive prepared"
            text: "Bring your client answers to the objections they will meet, with the debate that produced them."
          - title: "Clear about its limits"
            text: "Agents are simulations, not respondents. Results are hypotheses to check with real people, not a forecast."
      how:
        title: "How it works"
        intro: "From a brief to a report in four steps."
        items:
          - title: "Upload the brief"
            text: "Documents about the brand, the product and the market become the knowledge the agents draw on."
          - title: "Generate the population"
            text: "SwarMind builds personas with different backgrounds, priorities and stances, including a limited share of deliberately critical voices."
          - title: "Run the debate"
            text: "Over several rounds the agents post, reply and change their minds. The feed ranks what gains traction."
          - title: "Read the report"
            text: "The report sums up the objections, the arguments that held and how the debate moved, with polarisation and echo-chamber measures."
      use_cases:
        title: "Use cases"
        intro: "Templates for the moments when a narrative is most exposed."
        items:
          - title: "Rebranding"
            text: "Will long-time customers follow a new name or identity? Where does the bridge between generations break?"
          - title: "Pricing"
            text: "How do buyers react to a new price or plan, and which objections come from procurement and finance?"
          - title: "Product launch"
            text: "Which claims are believed, which are doubted, and what do people compare the product with?"
          - title: "Crisis communication"
            text: "Which version of a statement contains the damage, and which one feeds it?"
          - title: "Feature validation"
            text: "Does a new feature justify a price, or is it seen as noise?"
      deliverables:
        title: "What you get"
        intro: "Material you can take into a client meeting."
        items:
          - title: "A structured report"
            text: "Main objections, supporting arguments, the most exposed groups and recommendations, in English or Italian."
          - title: "The whole debate"
            text: "Every post and reply, by round and by agent, so each finding can be traced back to where it came from."
          - title: "Debate measures"
            text: "Polarisation, echo-chamber index and diversity of information, computed from the simulation itself."
          - title: "Conversations with agents"
            text: "Ask an agent why it changed its mind, or what would convince it."
          - title: "PDF export"
            text: "A report you can share with the client team."
      open_source:
        title: "Open source"
        intro: "SwarMind is also an open-source project: you can run it on your own server, with your own model keys."
        github_url: "https://github.com/DolcevitaInteractiveStudio/swarmind"
        docs_url: ""
        license_name: "AGPL-3.0"
        install_snippet: |-
          git clone https://github.com/DolcevitaInteractiveStudio/swarmind.git swarmind
          cd swarmind
          cp .env.example .env   # then set ENCRYPTION_KEY: see the README
          docker compose up -d
      contact:
        title: "Request a demo"
        intro: "Tell us about the launch, rebrand or statement you need to test. We will show you a simulation on a comparable case."
        cta_label: "Write to us"
        # The address comes from CONTACT_EMAIL (.env): core/site_settings.default_content
        email: ""
        url: ""
    footer:
      # Empty: the footer shows the product name
      company_name: ""
      contact_email: ""
      privacy_url: ""
      terms_url: ""
    seo:
      title: "SwarMind: stress-test your narrative before launch"
      description: >-
        Simulate how a population of AI agents reacts to a rebrand, a price or a crisis statement,
        and prepare for the objections before launch.
