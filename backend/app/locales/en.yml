    medium: "conviction_medium"
    high: "conviction_high"
    very_high: "conviction_very_high"
  tone_not_stated: "not stated"
  # Reader labels of the metrics and fields the report model receives. Raw field names
  # (mean_opinion_strength, opinion_entropy...) only in the methodology appendix.
  labels:
    rounds: "Rounds"
    agents: "Agents"
    total_posts: "Total posts"
    # "Consensus" is only the agreement on the stance toward the change; the variance of conviction is
    # conviction uniformity
    consensus_level: "Stance consensus"
    conviction_uniformity: "Conviction uniformity"
    mean_conviction: "Mean conviction"
    conviction: "conviction"
    variance: "Conviction variance"
    stance: "Stance on the change"
    stance_natural: "Stance on the change (natural agents)"
    stance_adversarial: "Stance on the change (critical voices)"
    stance_shift: "Stance shift (first → last measurement)"
    opinion_entropy: "Conviction entropy (last round)"
    emotional_state: "emotional state"
    posts: "posts"
  # Words that replace raw field names written by the model outside the methodology appendix
  field_words:
    mean_opinion_strength: "mean conviction"
    opinion_strength: "conviction"
    opinion_entropy: "conviction entropy"
    consensus_level: "stance consensus"
    conviction_uniformity: "conviction uniformity"
    emotional_state: "emotional state"
    posts_made: "posts"
    polarization_delta: "conviction polarization"
    echo_chamber_index: "echo chamber"
    information_diversity: "information diversity"
    is_adversarial: "critical voice"
  # Stance consensus (agreement on the stance)
  consensus_levels:
    high: "high"
    medium: "medium"
    low: "low"
  # Conviction uniformity (from the variance): not consensus
  conviction_uniformity_levels:
    high: "high"
    medium: "medium"
    low: "low"
  # Stance of the agents on the change (English enum values in the data)
  stance_values:
    support: "support"
    neutral: "neutral"
    oppose: "oppose"
  stance:
    share: "{label} {count} ({pct})"
    agents_not_measured: "agents not measured: {count}"
    unparsed: "unparsed replies, counted as neutral: {count}"
    not_measured: "not measured (simulation created before the stance measure)"
    consensus: "{level} ({pct} {stance})"
    consensus_tie: "{level} (no majority: {stances} tied at {pct} each)"
    shift: "{changed} of {remeasured} re-measured agents changed stance ({toward_support} more supportive, {toward_oppose} more opposed): {reading}{cap_note}"
    shift_cap_note: " (fewer than {min} re-measured agents: at most moderate)"
    shift_with_count: "{reading} ({changed} of {remeasured} re-measured agents)"
    # Stance of a segment with fewer than 3 agents: counts, never percentages
    count_share: "{count} of {total} {label}"
    shift_none: "no agent measured twice: shift not measurable"
    shift_unmeasurable: "shift not measurable"
    shift_readings:
      stable: "stable positions"
      moderate: "moderate shift"
      large: "large shift"
    groups:
      natural: "natural agents"
      adversarial: "critical voices"
  # Agent counts in the scenarios and the prediction, replaced by a quantifier
  # (postprocess.remove_population_shares)
  population:
    noun: "agents"
    noun_natural: "natural agents"
    quantifiers:
      none: "none of the {noun}"
      few: "a few {noun}"
      minority: "a minority of the {noun}"
      plurality: "a plurality of the {noun}"
      half: "half of the {noun}"
      majority: "most {noun}"
      almost_all: "almost all {noun}"
      all: "all {noun}"
  # Agent claims cited in the scenarios and the prediction (postprocess.mark_unverified_claims)
  claims:
    # The whole sentence starts with the attribution, never the middle of it
    attributed: "According to {agent}, {sentence} (the agent's claim, not verified in the brief: not evidence){end}"
  # Parameter lines of the appendix, written by the system from the saved simulation (postprocess.appendix_parameters)
  parameters:
    heading: "**Simulation parameters:**"
    template: "Template"
    agents: "Total number of agents"
    rounds: "Number of rounds"
    topic: "Topic analysed"
    question: "Question to test"
    not_specified: "not specified"
  # Share of the published posts written by the top 3 influencers, computed by the system (appendix)
  top3:
    share: "The 3 most active natural agents account for {top_pct} of the posts published ({top_posts} of {total_posts}); the remaining {rest_pct} comes from the agents not quoted."
    share_with_critical: "The 3 most active natural agents account for {top_pct} of the posts published ({top_posts} of {total_posts}); the critical voices published {critical_posts} ({critical_pct}), at a frequency set by the system; the remaining {rest_pct} comes from the other natural agents."
    unknown: "The share of posts written by the top 3 is not available for this simulation."
  # Rewording of "consensus" in the model's text (postprocess.fix_consensus_wording)
  consensus_rewording:
    conviction_noun: "conviction uniformity"
    level_before: "{level} {noun}"
    stance_level_before: "{level} {noun}"
    # Italian articles before the replaced word (an Italian word in an English report keeps its article)
    articles:
      il: "il "
      lo: "lo "
      un: "un "
      del: "del "
      al: "al "
      sul: "sul "
      nel: "nel "
      dal: "dal "
    unmeasured_noun: "prevailing positions"
