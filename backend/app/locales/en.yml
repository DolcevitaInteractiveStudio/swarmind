# Interpretations of metrics.py: "Label (figures): meaning". The part before "): " is stripped in the report table.
metrics:
  polarization_delta:
    insufficient_data: "Insufficient data to compute conviction polarization over time (at least 2 rounds needed)."
    # Conviction polarization (opinion_strength): it only talks about how strongly the agents are convinced
    polarization_active: "More polarized conviction (delta +{delta}): during the conversation conviction intensity drew apart, between strongly convinced and weakly convinced agents."
    depolarization: "Less polarized conviction (delta {delta}): during the conversation conviction intensity drew closer: the agents became more similar in how convinced they are."
    stable: "Stable conviction (delta {delta}): during the conversation the distribution of conviction intensity did not change significantly."
  echo_chamber_index:
    insufficient_data: "Insufficient data to compute the echo chamber index (at least 3 rounds with 2+ posts needed)."
    failed: "The similarity between posts could not be computed."
    echo_chamber_strong: "Strong echo chamber (mean similarity {score}): agents converge on a shared vocabulary, amplifying the same ideas instead of challenging them. The topic produces echo, not debate."
    partial_debate: "Partial debate (mean similarity {score}): different positions coexist, with their vocabularies influencing each other. The factions listen to each other."
    parallel_silos: "Parallel silos (mean similarity {score}): agents talk about topics too different from each other. The topic did not bring the debate onto common ground."
  information_diversity:
    insufficient_data: "Insufficient data to compute information diversity (at least 3 rounds needed)."
    insufficient_trend: "Insufficient data for the diversity trend."
    rapid_collapse: "Rapid narrative flattening ({delta_pct}% unique keywords between the first and second half of the simulation): the conversation quickly converges on a few dominant themes, leaving nuance out. A sign of narrative saturation."
    gradual_convergence: "Gradual convergence ({delta_pct}% unique keywords): the debate gradually focuses on 2-3 central themes, leaving the noise out. A healthy consolidation."
    diversity_growth: "Narrative expansion ({delta_pct}% more unique keywords): the conversation opens up to new arguments over time. The topic generates unexpected depth."
    stable_diversity: "Stable diversity ({delta_pct}% change): the conversation keeps a constant variety of arguments, neither flattening nor expanding significantly."

