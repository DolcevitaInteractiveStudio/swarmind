    anxious: "anxious"
    optimistic: "optimistic"
    angry: "angry"
    curious: "curious"
    skeptical: "skeptical"
    sceptical: "skeptical"
    enthusiastic: "enthusiastic"
    frustrated: "frustrated"
    betrayed: "betrayed"
    probing: "probing"
    weary: "weary"
    challenged: "challenged"
    critical_neutral: "critical but neutral"
    cautious: "cautious"
    concerned: "concerned"
    worried: "worried"
    hopeful: "hopeful"
    excited: "excited"
    confused: "confused"
    indifferent: "indifferent"
    disappointed: "disappointed"
    critical: "critical"
    supportive: "supportive"
    pessimistic: "pessimistic"
    nostalgic: "nostalgic"
    defensive: "defensive"
    irritated: "irritated"
    annoyed: "annoyed"
    interested: "interested"
    doubtful: "doubtful"
    uncertain: "uncertain"
    resigned: "resigned"
    determined: "determined"
    calm: "calm"
    positive: "positive"
    negative: "negative"
    ambivalent: "ambivalent"
    intrigued: "intrigued"
    alarmed: "alarmed"
    distrustful: "distrustful"
    suspicious: "suspicious"
    passionate: "passionate"
    proud: "proud"
    nervous: "nervous"
    fearful: "fearful"
    satisfied: "satisfied"
    dissatisfied: "dissatisfied"
    pragmatic: "pragmatic"
    analytical: "analytical"
  template_none: "none"
  adversarial_note_heading: "**Critical voices:**"
  archetypes:
    population_demographer: "The population composition is proposed by the Demographer (an LLM) from the brief"
    population_kb: "The natural agents derive from the entities extracted from the knowledge base"
    with_template: >-
      - {population}, and the critical voice archetypes (journalist, competitor, early adopter, etc.)
      are defined by the template: neither is validated against real demographic distributions.
    without_template: >-
      - {population}, and the critical voices come from the brief or from the user (no template
      used): neither source is validated against real demographic distributions.
    # A line containing this text describes template archetypes: replaced when there is no template
    template_needle: "defined by the template"
  # The limits line containing this text is removed when the report has no recommendations section
  recommendations_needle: "operational recommendations"
  appendix: |-
    ---

    **Simulation parameters:**
    {parameters}

    **Selection criteria for the agents quoted:**
    The top 3 influencers are the natural agents with the most posts published: critical voices are not ranked, because the system sets how often they speak. The other agents contribute to the metrics (stance, conviction, entropy) but are not quoted individually in the report. {top3_sentence}

    **Critical voices:**
    Critical voices are agents the system deliberately added to stress-test the prevailing positions. They do not represent a natural market distribution: their presence amplifies criticism to surface vulnerabilities.

    **Confidence score — nature of the metric:**
    The confidence level is computed by the system, not by the model: it starts from the stability of the agents' stance on the change (consensus and shift between the first and the last measurement; for simulations without the stance measure, from the variance and opinion_entropy of conviction) and is capped by the sample size ({confidence_rule}). This is why scenarios only have a qualitative plausibility, with no percentages. It is NOT calibrated retroactively against real outcomes (no Brier score, no historical track record). Read it as an internal indicator of the stability of the simulated positions, not as a verified probability of predictive accuracy.

    **Known limits of the method:**
    - The simulation measures pre-launch opinions expressed by LLM agents, not real market behaviour.
    {archetypes_limitation}
    - The positions found may partly be an artefact of the initial simulation prompt: enthusiastic or pessimistic prompts can steer the dynamics. A/B tests with varied prompts are not included in this run.
    - The operational recommendations are consistent with the product stage stated in the topic but have not been validated with real effectiveness tests.
  # Sentences of the code in the "Critical voices" paragraph of the appendix (postprocess.critical_voices_disclosure)
  share:
    not_recorded: "Share of posts by critical voices: not recorded for this simulation."
    none: "Share of posts by critical voices: 0% (no critical voices in this simulation)."
    full: >-
      Share of posts by critical voices: {share} ({adversarial_posts} of {posts} posts in the whole
      simulation), from {adversarial_agents} critical voices out of {total_agents} agents. The share
      depends on how often the system lets these voices speak: it does not measure how widespread the
      criticism is in the market.
    # Two different caps: one counts agents, the other posts
    caps: >-
      Two different limits apply to critical voices: at most {agent_cap} of the agents in the simulation
      can be critical voices (share of agents), and at most {post_cap} of the posts can come from
      critical voices (share of posts).
    truncated_one: >-
      {planned} critical voices were planned; {kept} was kept to respect the maximum share of critical
      voices ({agent_cap} of the agents); {excluded}
    truncated_many: >-
      {planned} critical voices were planned; {kept} were kept to respect the maximum share of critical
      voices ({agent_cap} of the agents); {excluded}
    excluded_one: "the excluded one was chosen at random."
    excluded_many: "the {count} excluded ones were chosen at random."
  relabel:
    natural_many: "critical voices (adversarial agents)"
    natural_one: "a critical voice (adversarial agent)"
    # Inside parentheses (no nested parentheses) and before a name
    natural_many_flat: "critical voices, adversarial agents"
    paren: "critical voice, adversarial agent"
    before_name_article: "the critical voice"
    before_name: "critical voice"
    # Article of the plural label, replacing gli/i/the before "agenti naturali"
    many_article: "the"
