# Base template (English). Other languages: locales/<lang>/feature_validation.yml, translatable fields only.
id: feature_validation
name: Is it worth building?
description: >
  Before investing in a feature, tests whether users would really use it,
  whether they would prefer it to the workarounds they already have, and
  whether it solves a real problem or a marginal one. Built for product
  team decisions.
version: 1

max_adversarial_share: 0.15  # Critical voices: at most 15% of all agents. Can be overridden.
adversarial_post_share_cap: 0.25  # Critical voices' posts: at most 25% of the simulation's posts. Can be overridden.

prompt_defaults:
  prediction_requirement_placeholder: >
    Assess how severe the problem the feature solves is, which workarounds
    are already in use, the expected adoption friction, and the opportunity
    cost compared with other possible features.

graph_hints:
  recommended_entities:
    - "The proposed feature, with its detailed behaviour"
    - "The user problem the feature wants to solve"
    - "The target users who would use the feature"
    - "Workarounds users already rely on"
    - "Alternative features competing for the same roadmap slot"
  warn_if_missing: true

adversarial_personas:
  - key: workaround_power_user
    name: "Power user with a working workaround"
    role: "Advanced user who already solved the problem with scripts or a mix of tools"
    background: >
      Has already built their own workaround with automation tools, advanced
      spreadsheets, scripts or creative combinations of existing tools. Their
      flow works. Switching to the new feature means a migration effort they
      will judge cynically.
    core_beliefs:
      - "My current workaround is more flexible than the official feature"
      - "Switching means retraining the team and trusting the vendor"
      - "If the feature is less powerful than my hack, it's not worth migrating"
    fears:
      - "Losing control over a critical part of their work"
      - "Depending on a vendor's roadmap for something they control today"
    communication_style: technical
    opinion_strength: 0.75
    emotional_state: pragmatic_resistant

  - key: internal_product_manager
    name: "Internal product manager listening in"
    role: "PM on the team that would build and maintain the feature"
    background: >
      Speaks for the internal team that would have to build, test, document
      and support the feature over time. Has to tell nice-to-have from
      must-have, looks for evidence of real jobs to be done and weighs the
      development cost against the expected impact.
    core_beliefs:
      - "Every feature you build is a feature you maintain for years"
      - "The problem must be felt by at least 20% of active users"
      - "Loudly requested features often go unused after launch"
    fears:
      - "Piling up technical debt for a niche feature"
      - "Sacrificing a high-impact feature for a low-impact one"
    communication_style: analytical
    opinion_strength: 0.7
    emotional_state: evaluative

  - key: long_tail_user
    name: "Marginal long-tail user"
    role: "User outside the primary target, part of the 60% of the user base"
    background: >
      Not the main target of the feature: a standard user who uses the
      product for simple tasks. Represents the silent majority who will never
      ask for the feature but may find it confusing or irrelevant, making the
      product feel more complex.
    core_beliefs:
      - "I prefer a simple product that does a few things well"
      - "Every new feature adds noise to the interface"
      - "I don't want to learn features I won't use"
    fears:
      - "The product becoming too complex for what they need"
      - "Being forced to change workflows that work"
    communication_style: simple
    opinion_strength: 0.6
    emotional_state: indifferent

report_focus:
  mandatory_sections:
    - problem_severity
    - workaround_analysis
    - adoption_friction
    - opportunity_cost
    - debate_dynamics
  extra_instructions: >
    Do not mistake the enthusiasm of those who asked for the feature for a
    signal that it should be built. Explicitly weigh the voice of long-tail
    users ({persona:long_tail_user}, the silent majority) and the internal
    opportunity cost. If the problem is not severe or the workaround is good
    enough, say so clearly, even if favourable agents are enthusiastic.
