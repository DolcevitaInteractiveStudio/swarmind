server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    # Same limit as the backend (MAX_CONTENT_LENGTH): nginx's default of 1 MB rejects most briefs
    client_max_body_size 500m;
    # The SPA document gets the same policy the backend sets on /api responses: report HTML from
    # the model or the user cannot load external images or post forms elsewhere (security audit 2026-11)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation and agent chat can take minutes (gunicorn --timeout 300)
        proxy_read_timeout 300s;
    }
    location /socket.io/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
