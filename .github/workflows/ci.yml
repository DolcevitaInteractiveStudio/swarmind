# Checks on every pull request and on every push to main. No deploy step: deploys stay manual
# (docs/manual, operations). Every value below is a test-only placeholder: the suite needs no secret.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and template validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # PostgreSQL for the migration tests (they are skipped without SWARMIND_TEST_PG_URL)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swarmind_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: swarmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarmind_ci -d swarmind_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only placeholder (base64 of "for-tests-only-not-a-real-key-00"), allowlisted in .gitleaks.toml
      ENCRYPTION_KEY: Zm9yLXRlc3RzLW9ubHktbm90LWEtcmVhbC1rZXktMDA=
      SWARMIND_TEST_PG_URL: postgresql://swarmind_ci:ci-only-password@localhost:5432/swarmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same Python as backend/Dockerfile
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - name: Install dependencies (pinned by constraints.txt)
        run: pip install -r requirements.txt -c constraints.txt pytest
      - name: Tests, migrations on PostgreSQL included
        run: python -m pytest -q
      - name: Template validation
        run: python -m app.templates.validate

  frontend:
    name: Frontend build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node as frontend/Dockerfile
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: i18n keys (en/it)
        run: npm run check:i18n
      - name: Build
        run: npm run build
      - name: Bundle (no eval in the i18n stack)
        run: npm run check:bundle
      - name: Colour contrast (WCAG AA)
        run: npm run check:contrast

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan covers every commit of the push or the pull request
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read-only token: no comments on the pull request, the findings are in the job log
          GITLEAKS_ENABLE_COMMENTS: false
          # Only needed if the repository moves to an organization account (free key from gitleaks.io)
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
